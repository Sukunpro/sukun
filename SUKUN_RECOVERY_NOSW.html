<script id="sukun-RECOVERY-NOSW-seyir-carousel-runtime">
(()=>{"use strict";
 const root=document.getElementById("berhetSeyir");
 const clean=()=>{
   if(!root)return;
   root.querySelectorAll(".r168Buttons .r866JewelImg,.r168Buttons img[class*='Jewel']").forEach(n=>n.remove());
   root.querySelectorAll(".r168Buttons button").forEach(b=>{
     b.classList.remove("r866JewelBtn");
     ["transform","filter","background","backgroundImage","boxShadow"].forEach(k=>b.style.removeProperty(k));
   });
 };
 const makeRails=()=>{
   const scopes=[document.getElementById("berhetSeyir"),document.getElementById("esmaSeyir"),
     document.getElementById("esmaList"),document.getElementById("berhetiyyeList"),document.getElementById("esmaulHusna")].filter(Boolean);
   scopes.forEach(scope=>{
     scope.querySelectorAll(".nameRail,.name-rail,.esmaRail,.esma-rail,.chips,.chipRow,.chip-row,.tabs,[role='tablist']").forEach(rail=>{
       rail.dataset.RECOVERY-NOSWRail="1";
       const selected=rail.querySelector('[aria-selected="true"],.active,.selected,[data-active="true"]');
       if(selected) requestAnimationFrame(()=>selected.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"}));
     });
   });
 };
 const run=()=>{clean();makeRails()};
 document.addEventListener("DOMContentLoaded",run,{once:true});
 addEventListener("pageshow",run);
 document.addEventListener("click",e=>{
   if(e.target.closest("#berhetSeyir,#esmaSeyir,#esmaList,#berhetiyyeList,#esmaulHusna")) setTimeout(makeRails,0);
 },true);
})();
</script>
