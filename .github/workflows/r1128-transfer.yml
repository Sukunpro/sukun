name: Transfer explicitly approved r1128 candidate
on:
  push:
    branches: [release/r1128-approved-20261026]
    paths: [.github/workflows/r1128-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out transfer branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Restore byte-identical approved candidate and verified originals
        run: |
          python3 - <<'PYCODE'
          import base64, concurrent.futures, hashlib, json, subprocess, urllib.request, zlib
          from pathlib import Path
          payload = ''
          patch = zlib.decompress(base64.b64decode(payload))
          subprocess.run(['git', 'apply', '--index', '--binary', '-'], input=patch, check=True)
          folder = Path('assets/audio/delail-giles-r1128')
          tracks = json.loads((folder/'source-metadata.json').read_text())['original_files']
          assert len(tracks) == 9
          allowed = {'opening.mp3'} | {f'h{i}.mp3' for i in range(1,9)}
          def fetch(track):
              name = track['filename']; url = track['source_url']
              assert name in allowed and url.startswith('https://al-adaab.org/audio/dalailul_%20khayrat/')
              with urllib.request.urlopen(url, timeout=180) as response:
                  data = response.read()
              assert len(data) == track['bytes'], name + ': wrong size'
              assert hashlib.sha256(data).hexdigest() == track['sha256'], name + ': wrong hash'
              (folder/name).write_bytes(data)
              return name
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              print('Verified originals:', ', '.join(pool.map(fetch, tracks)))
          PYCODE
      - name: Check focused reader contracts
        run: |
          node tests/r1128/delail-recorded-contract.cjs . "$RUNNER_TEMP/r1128-recorded.json"
          node tests/r1128/delail-tts-lifecycle.cjs . "$RUNNER_TEMP/r1128-lifecycle.json"
      - name: Commit exact candidate tree to transfer branch
        run: |
          git rm -- .github/workflows/r1128-transfer.yml
          git add --all
          test "$(git write-tree)" = "98a5a4efad2262c1ca061b8ce3d7fb5c6199bc90"
          git config user.name "Sukunpro"
          git config user.email "termuxumut@gmail.com"
          git commit -m "Release r1128: original Arabic Delail recitation and release gate"
          git push origin HEAD:refs/heads/release/r1128-approved-20261026
