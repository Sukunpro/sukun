name: Inspect original Berhetiyye gemstone artwork before publication
on:
  push:
    branches: [release/r1132-final-stones-20261027]
    paths: [.github/workflows/r1132-transfer.yml]
permissions:
  contents: write
defaults:
  run:
    working-directory: candidate
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out transfer candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: candidate
      - name: Check out unchanged r1131 visual reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4f9b50e715f5dfd750060d86272bc1d309dcaf93
          path: baseline
          persist-credentials: false
      - name: Restore exact r1132 source
        run: |
          python3 - <<'PYCODE'
          import base64, subprocess, zlib
          payload = ''
          subprocess.run(['git','apply','--index','--binary','-'], input=zlib.decompress(base64.b64decode(payload)),check=True)
          expected = {'assets/runtime/health-r940.js': '5dc56d33f2349e43f0a4221ace81bae0493753e5', 'assets/runtime/startup-intro-r1027.js': 'c0f49027ee857cb86de9e575f03ce547f5e584a9', 'css/berhet-original-stone-r1132.css': '090bc0098035a74a71883edfd9ff156a50335d4e', 'index.html': 'd70d57e7f36036ec45b87263ca9e3fa3b80605cb', 'manifest.webmanifest': '03088d1c0a806a5964771425ffbe44039530324c', 'nero.html': 'd70d57e7f36036ec45b87263ca9e3fa3b80605cb', 'sukun-build-r1132.json': '3e0aa39939a825183f230ece4adbd8af5073addb', 'sukun-latest.json': '48521ad0f94c6ba7716815405ec3a5db2973f463', 'sukun-site-assets-r1132.json': '39844d979d69388106e82aae268446993c3c6320', 'surumler.json': '48188e78755b75e940ef2f99bf5a7274fad19129', 'sw.js': '25042f08eaac2cb74e921f2c41f1fbe5f83283e1', 'tests/r1132/activation-deadline-contract.cjs': '6ca06306a87a2b744588e76c482bae6ee18ed4d3', 'tests/r1132/button-clarity-browser.cjs': 'ce7ff29a612fee7e77b18b23eeb6907afa824c60', 'tests/r1132/release-upgrade-browser.cjs': '81e784c1b7793b86fea473a25a1e25e8c6ae057e', 'tests/r1132/run-release-checks.py': 'ff011640f47ba323ebdcd6cb9879cd662903b740', 'version.txt': '02d032d4f6e3dcb54fe7c0f41876c0cc394035c7'}
          for path, sha in expected.items():
              assert subprocess.check_output(['git','rev-parse',':'+path],text=True).strip()==sha,path
          assert not subprocess.check_output(['git','diff','--cached','--name-only','--','.github/'],text=True).strip()
          print('Verified candidate files:',len(expected))
          PYCODE
      - name: Verify release graph and bounded health marker
        run: |
          node tools/release-integrity.cjs . > "$RUNNER_TEMP/r1132-integrity.log"
          node tests/r1120/health-marker-bytes.cjs . "$RUNNER_TEMP/r1132-health.json"
          git restore tools/release-integrity-results.json
      - name: Prepare pinned browser driver
        run: |
          export NODE_PATH="$RUNNER_TEMP/sukun-r1132-browser/node_modules"
          echo "NODE_PATH=$NODE_PATH" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/sukun-r1132-browser" --no-audit --no-fund playwright@1.57.0
          if command -v google-chrome >/dev/null 2>&1; then
            candidate_chrome="$(command -v google-chrome)"
          else
            "$RUNNER_TEMP/sukun-r1132-browser/node_modules/.bin/playwright" install --with-deps chromium
            candidate_chrome="$(node -p 'require("playwright").chromium.executablePath()')"
          fi
          echo "CHROMIUM_PATH=$candidate_chrome" >> "$GITHUB_ENV"
      - name: Capture and verify native-DPR buttons against r1131
        env:
          SUKUN_VISUAL_QUICK: "1"
        run: node tests/r1132/button-clarity-browser.cjs . "$RUNNER_TEMP/r1132-button-clarity.json" ../baseline
      - name: Commit visually verified candidate
        run: |
          git add --all
          git config user.name "Sukunpro"
          git config user.email "termuxumut@gmail.com"
          git commit -m "Stage original Berhetiyye gemstone controls for r1132"
          git rev-parse HEAD
          git push origin HEAD:refs/heads/release/r1132-final-stones-20261027
      - name: Preserve isolated visual QA images and source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r1132-button-quality
          path: |
            ${{ runner.temp }}/r1132-button-clarity.json
            ${{ runner.temp }}/button-clarity/*.png
          if-no-files-found: warn
          retention-days: 7
