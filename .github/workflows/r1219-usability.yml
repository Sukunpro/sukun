name: Current usability and keyboard checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "codex/r1219-stability"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: usability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  usability:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/sukun-browser" --no-audit --no-fund playwright@1.57.0
          echo "NODE_PATH=$RUNNER_TEMP/sukun-browser/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/sukun-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Measure mobile text and gemstone frames
        run: |
          export CHROMIUM_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          node tests/r1219/mobile-layout.cjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/usability/mobile"
      - name: Verify Atlas keyboard navigation and session preservation
        if: always()
        run: |
          export CHROMIUM_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          node tests/r1219/atlas-keyboard.cjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/usability/keyboard"
      - name: Save measurements and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: usability-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/usability
          if-no-files-found: error
          retention-days: 30
