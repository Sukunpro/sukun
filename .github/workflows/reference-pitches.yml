name: Reference pitches and frequency diagnostics
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: reference-pitches-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d91b3d1665c70cfc9d49a1fef9ffad0815c71059
          path: r1261
          persist-credentials: false
      - name: Install pinned Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/sukun-browser" --no-audit --no-fund playwright@1.57.0
          export NODE_PATH="$RUNNER_TEMP/sukun-browser/node_modules"
          echo "NODE_PATH=$NODE_PATH" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/sukun-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -p 'require("playwright").chromium.executablePath()')" >> "$GITHUB_ENV"
      - name: Measure four reference pitches and inject diagnostic faults
        working-directory: candidate
        run: node tests/r1262/reference-pitches-browser.cjs . ../evidence/reference-pitches.json
      - name: Verify upgrade from r1261 and offline recovery
        working-directory: candidate
        run: node tests/r1213/release-upgrade-browser.cjs . ../r1261 ../evidence/upgrade-from-r1261.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reference-pitches-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 30
