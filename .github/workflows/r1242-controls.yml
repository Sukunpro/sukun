name: r1242 Berhetiyye easy controls regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  easy-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned native browser
        run: |
          npm install --prefix "$RUNNER_TEMP/sukun-browser" --no-audit --no-fund playwright@1.57.0
          echo "NODE_PATH=$RUNNER_TEMP/sukun-browser/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/sukun-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify source and native theme behavior
        run: |
          export CHROMIUM_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          node tests/r1242/capture-mockup.cjs "$PWD" "$RUNNER_TEMP/r1242-evidence/mockup"
          node tests/r1242/easy-controls-source.cjs
          node tests/r1242/settings-auto-hide.cjs
          node tests/r1242/easy-controls-browser.cjs "$PWD" "$RUNNER_TEMP/r1242-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r1242-controls-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/r1242-evidence
          if-no-files-found: error
          retention-days: 30
