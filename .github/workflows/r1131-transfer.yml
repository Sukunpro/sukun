name: Inspect faceted Berhetiyye jewels before publication
on:
  push:
    branches: [release/r1131-berhet-jewels-20261027]
    paths: [.github/workflows/r1131-transfer.yml]
permissions:
  contents: write
defaults:
  run:
    working-directory: candidate
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out transfer candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: candidate
      - name: Check out unchanged r1130 visual reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 08701b15d603ee4b8ed1815fc31e67281095db04
          path: baseline
          persist-credentials: false
      - name: Restore exact r1131 source
        run: |
          python3 - <<'PYCODE'
          import base64, subprocess, zlib
          payload = ''
          subprocess.run(['git','apply','--index','--binary','-'], input=zlib.decompress(base64.b64decode(payload)),check=True)
          expected = {'assets/berhetiyye-premium/r1131/face-amethyst.svg': '4929ab30f0565218f4cd1dd73e87fac75672d0c8', 'assets/berhetiyye-premium/r1131/face-black-diamond.svg': '3c69626a0de7c5bde3aef6e0473960a625d74906', 'assets/berhetiyye-premium/r1131/face-citrine.svg': 'b4e43a92edd6671b288ce096b971d10c51b9b74f', 'assets/berhetiyye-premium/r1131/face-diamond.svg': '62aed8909a2145c2f7a8954c2c8f43fd6351c56a', 'assets/berhetiyye-premium/r1131/face-emerald.svg': 'f80933c9399c666e9fb9e4cc029c3546c2e57451', 'assets/berhetiyye-premium/r1131/face-ruby.svg': '1b99214edecf9c017c5080fc9afe135178276397', 'assets/berhetiyye-premium/r1131/face-sapphire.svg': 'd12bec5939983ed387b423b364aa47b519dd6c92', 'assets/berhetiyye-premium/r1131/face-topaz.svg': 'c3dae1477e7b95866f1af540e53d44b36328071f', 'assets/berhetiyye-premium/r1131/frame-gold.svg': '1d76a96015c1bd19ecfcb506ab6805776aef27ef', 'assets/berhetiyye-premium/r1131/frame-silver.svg': '1fb6048552cd36c1ac72af84adf590dd33e3ea77', 'assets/runtime/health-r940.js': 'b3a189298ec50ca9cc24f109854e07720e1ab7ef', 'assets/runtime/startup-intro-r1027.js': '41f583a16f61fb1e1e2e2e505125227edf667d3c', 'css/berhet-jeweled-controls-r1131.css': 'fc38fe2e7c48ad6142bb490adcf199763f88b3b4', 'index.html': '95e5a59b3f1a8784b2b7a9fd72836bde34f8f78e', 'manifest.webmanifest': 'b85c40e941e8c003e65f91718967ad43ec8919bf', 'nero.html': '95e5a59b3f1a8784b2b7a9fd72836bde34f8f78e', 'sukun-build-r1131.json': '89c41fe93a3a06160c0169fe5c412e9a18b4715b', 'sukun-latest.json': 'f89c92b9bb2d36c9970891e22f5893a154297f47', 'sukun-site-assets-r1131.json': 'db1e5e898aeaad471d0fd4b7bd27f7dc970a94aa', 'surumler.json': '84a2c2300e9997a15f55eb41462500cfb5bce4e8', 'sw.js': '9a1392c4d0cde4b7f53edbd765a8ba2f6376b715', 'tests/r1016/recovered/health_ui_audit.cjs': 'd80af6e05ca8e4e8be5c51811da1b55c2aff62b2', 'tests/r1131/activation-deadline-contract.cjs': 'adc1bef2c6c5f0c9d7a0511cec32f3823b4b1f4c', 'tests/r1131/button-clarity-browser.cjs': '00916485b064c870a86b36c065b3ca41b6cb7b2b', 'tests/r1131/release-upgrade-browser.cjs': 'd493114e528af6584948915ea1fdff0b7cf5b3d3', 'tests/r1131/run-release-checks.py': '8ac433ba7107a06debd69e92ff1fb2a1764fabdd', 'version.txt': 'f41b9d9880de7d5c77065b51784b5cd6f2e0fa70'}
          for path, sha in expected.items():
              assert subprocess.check_output(['git','rev-parse',':'+path],text=True).strip()==sha,path
          assert not subprocess.check_output(['git','diff','--cached','--name-only','--','.github/'],text=True).strip()
          print('Verified candidate files:',len(expected))
          PYCODE
      - name: Verify release graph and bounded health marker
        run: |
          node tools/release-integrity.cjs . > "$RUNNER_TEMP/r1131-integrity.log"
          node tests/r1120/health-marker-bytes.cjs . "$RUNNER_TEMP/r1131-health.json"
          git restore tools/release-integrity-results.json
      - name: Prepare pinned browser driver
        run: |
          export NODE_PATH="$RUNNER_TEMP/sukun-r1131-browser/node_modules"
          echo "NODE_PATH=$NODE_PATH" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/sukun-r1131-browser" --no-audit --no-fund playwright@1.57.0
          if command -v google-chrome >/dev/null 2>&1; then
            candidate_chrome="$(command -v google-chrome)"
          else
            "$RUNNER_TEMP/sukun-r1131-browser/node_modules/.bin/playwright" install --with-deps chromium
            candidate_chrome="$(node -p 'require("playwright").chromium.executablePath()')"
          fi
          echo "CHROMIUM_PATH=$candidate_chrome" >> "$GITHUB_ENV"
      - name: Capture and verify native-DPR buttons against r1130
        run: node tests/r1131/button-clarity-browser.cjs . "$RUNNER_TEMP/r1131-button-clarity.json" ../baseline
      - name: Commit visually verified candidate
        run: |
          git add --all
          git config user.name "Sukunpro"
          git config user.email "termuxumut@gmail.com"
          git commit -m "Stage faceted gemstones and carved precious metal for r1131"
          git rev-parse HEAD
          git push origin HEAD:refs/heads/release/r1131-berhet-jewels-20261027
      - name: Preserve isolated visual QA images and source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r1131-button-quality
          path: |
            ${{ runner.temp }}/r1131-button-clarity.json
            ${{ runner.temp }}/button-clarity/*.png
          if-no-files-found: warn
          retention-days: 7
