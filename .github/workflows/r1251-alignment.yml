name: r1251 responsive alignment
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: r1251-alignment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  responsive-alignment:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Chromium test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/sukun-browser" --no-audit --no-fund playwright@1.57.0
          echo "NODE_PATH=$RUNNER_TEMP/sukun-browser/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/sukun-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Source integrity and syntax
        run: |
          node --check tests/r1251/alignment-browser.cjs
          node tools/release-integrity.cjs .
          node tests/frequency-screenshot-fit/contract.cjs .
          node tests/r1250/verse-content.cjs
      - name: Responsive native rendering and screenshots
        run: |
          export CHROMIUM_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          node tests/r1251/alignment-browser.cjs "$PWD" "$RUNNER_TEMP/r1251-evidence/report.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r1251-responsive-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/r1251-evidence
          if-no-files-found: error
          retention-days: 30
