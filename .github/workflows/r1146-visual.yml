name: r1146 mobile visual checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  screenshot-fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install browser
        run: |
          npm install --prefix "$RUNNER_TEMP/sukun-browser" --no-audit --no-fund playwright@1.57.0
          echo "NODE_PATH=$RUNNER_TEMP/sukun-browser/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/sukun-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check and capture mobile views
        run: |
          export CHROMIUM_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          node tests/r1146/screenshot-fit.cjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/r1146-visual"
      - name: Upload measurements and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r1146-mobile-visual
          path: ${{ runner.temp }}/r1146-visual
          if-no-files-found: warn
