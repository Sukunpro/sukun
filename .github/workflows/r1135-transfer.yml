name: Verify r1135 mobile gemstone layout before publication
on:
  push:
    branches: [release/r1135-mobile-20261027]
    paths: [.github/workflows/r1135-transfer.yml]
permissions:
  contents: write
defaults:
  run:
    working-directory: candidate
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out transfer candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: candidate
      - name: Check out unchanged previous live release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a085549e6844e29b02d9951e12f942d6a22985cb
          path: baseline
          persist-credentials: false
      - name: Restore exact r1135 source
        run: |
          python3 - <<'PYCODE'
          import base64, subprocess, zlib
          from pathlib import Path
          payload = Path('.github/r1135-transfer-payload.txt').read_text()
          subprocess.run(['git','apply','--index','--binary','-'], input=zlib.decompress(base64.b64decode(payload)),check=True)
          expected = {'assets/runtime/health-r940.js': '47aa2feca1ac3cb1ef0af56975cc3cf445ab952c', 'assets/runtime/startup-intro-r1027.js': '30a41d19d04c2e9239a29fe94131d36ac563a71a', 'css/berhet-responsive-r1135.css': '9d0eb310c11e96a80bfad95ea0596408f54adcd1', 'index.html': 'b42b304425cdfed6474851a1d44fdce19d7025d4', 'manifest.webmanifest': 'f136075642a812a26f79e27f40cefeb39c2234b7', 'nero.html': 'b42b304425cdfed6474851a1d44fdce19d7025d4', 'sukun-build-r1135.json': '6f968bbc14d01011e00d491ca3195315ce606efa', 'sukun-latest.json': 'd14a5c48718a8a2a98ac76f7f8f1cc2b8e92eccb', 'sukun-site-assets-r1135.json': '1857e2d190063d9be46e7454d164767592aeb443', 'surumler.json': '44e6414338ebcfcf13a88f3f5885006b89abf921', 'sw.js': '4cdabd155df752a3b694a98d3f194bb2cefaaa0b', 'tests/r1135/activation-deadline-contract.cjs': '23a9a534b60177936542c77f187db4cbe120450c', 'tests/r1135/mobile-layout.cjs': '0119dea833754d8a65729cddc36be2edf06b8e05', 'tests/r1135/release-upgrade-browser.cjs': '6256d94c81d96066f1a2f7d77f35b4a2f65f3f5a', 'tests/r1135/run-release-checks.py': '4a7c4988f09ddbf9a5992589731c0f68ed099951', 'version.txt': '219a4edc69dd9c3772a2b0841c38f9ebd62c6cc9'}
          for path, sha in expected.items():
              assert subprocess.check_output(['git','rev-parse',':'+path],text=True).strip()==sha,path
          assert not subprocess.check_output(['git','diff','--cached','--name-only','--','.github/'],text=True).strip()
          print('Verified candidate files:',len(expected))
          PYCODE
      - name: Verify release integrity and health marker
        run: |
          node tools/release-integrity.cjs . > "$RUNNER_TEMP/r1135-integrity.log"
          node tests/r1120/health-marker-bytes.cjs . "$RUNNER_TEMP/r1135-health.json"
          git restore tools/release-integrity-results.json
      - name: Prepare pinned browser driver
        run: |
          export NODE_PATH="$RUNNER_TEMP/sukun-r1135-browser/node_modules"
          echo "NODE_PATH=$NODE_PATH" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/sukun-r1135-browser" --no-audit --no-fund playwright@1.57.0
          if command -v google-chrome >/dev/null 2>&1; then
            candidate_chrome="$(command -v google-chrome)"
          else
            "$RUNNER_TEMP/sukun-r1135-browser/node_modules/.bin/playwright" install --with-deps chromium
            candidate_chrome="$(node -p 'require("playwright").chromium.executablePath()')"
          fi
          echo "CHROMIUM_PATH=$candidate_chrome" >> "$GITHUB_ENV"
      - name: Verify real mobile navigation and labels
        run: node tests/r1135/mobile-layout.cjs . "$RUNNER_TEMP/r1135-mobile-layout.json" ../baseline
      - name: Commit visually verified candidate
        run: |
          git config user.name "Sukunpro"
          git config user.email "termuxumut@gmail.com"
          git commit -m "Stage verified r1135 mobile gemstone layout"
          git rev-parse HEAD
          git push origin HEAD:refs/heads/release/r1135-mobile-20261027
      - name: Preserve visual QA and source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r1135-mobile-layout
          path: |
            ${{ runner.temp }}/r1135-mobile-layout.json
            ${{ runner.temp }}/button-clarity/*.png
          if-no-files-found: warn
          retention-days: 7
