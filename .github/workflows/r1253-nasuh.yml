name: r1253 Nasuh recording playback
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: r1253-nasuh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  nasuh-playback:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/sukun-browser" --no-audit --no-fund playwright@1.57.0
          echo "NODE_PATH=$RUNNER_TEMP/sukun-browser/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/sukun-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Source integrity and unit checks
        run: |
          node tools/release-integrity.cjs .
          node tests/prayer_recording_faults.cjs
          node tests/r1225/recording-races.cjs
      - name: Real Nasuh recording playback
        run: |
          export CHROMIUM_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          mkdir -p "$RUNNER_TEMP/r1253-evidence"
          node tests/nasuh/browser.cjs "$PWD" "$RUNNER_TEMP/r1253-evidence/report.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r1253-nasuh-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/r1253-evidence
          if-no-files-found: error
          retention-days: 30
