name: Inspect crisp Berhetiyye controls before publication
on:
  push:
    branches: [release/r1130-buttons-20261027]
    paths: [.github/workflows/r1130-transfer.yml]
permissions:
  contents: write
defaults:
  run:
    working-directory: candidate
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out transfer candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: candidate
      - name: Check out unchanged r1129 visual reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 65811b9e7b70aaa646d8a4609beb53dbb3b0cb5f
          path: baseline
          persist-credentials: false
      - name: Restore exact r1130 source
        run: |
          python3 - <<'PYCODE'
          import base64, subprocess, zlib
          payload = ''
          subprocess.run(['git','apply','--index','--binary','-'], input=zlib.decompress(base64.b64decode(payload)),check=True)
          expected = {'assets/berhetiyye-premium/gem-gold-bezel-r1130.svg': '40ddd88a6e3f45d823700a56beb0a9975216cea4', 'assets/runtime/startup-intro-r1027.js': 'c0a4a6a76e1b2608534047aee06104878f221f48', 'css/button-clarity-r1130.css': 'e468103520358222c47d01a9570e607825d47d8c', 'index.html': 'a0d133b9c21ab6ae6492a346e3d3098ff637adf1', 'manifest.webmanifest': '94aa3349dbb13f66d63b36659ed89acc70d2b9e4', 'nero.html': 'a0d133b9c21ab6ae6492a346e3d3098ff637adf1', 'sukun-build-r1130.json': 'c41e9e57565b40e6c14ae8857a5b3820eff49ccc', 'sukun-latest.json': '36f791063cb21957e3a93a59c7bbd9719b98c582', 'sukun-site-assets-r1130.json': '8a7a6880dbec677ba964c16134f6b89aef88a021', 'surumler.json': '467790b43739b8f510bbff1bb7dbb6990087aa28', 'sw.js': 'e26e863212d19f56bbf446e58686d7e5f78d5b7c', 'tests/r1130/activation-deadline-contract.cjs': '8605fcd6498cf09f8796f8107a4ed0a90d36fde9', 'tests/r1130/button-clarity-browser.cjs': '5a6e2448e354f216125f8898695ce76147f18a50', 'tests/r1130/release-upgrade-browser.cjs': 'fef2fac62966b6adeea4dbaf3292cd6df6b979bf', 'tests/r1130/run-release-checks.py': 'fc88427f1011a1bf3d2fe832fa190c75fbe3a3bb', 'version.txt': 'fce4bc1c23ad7b9d5618ebc2fd945b20a45f3983'}
          for path, sha in expected.items():
              assert subprocess.check_output(['git','rev-parse',':'+path],text=True).strip()==sha,path
          assert not subprocess.check_output(['git','diff','--cached','--name-only','--','.github/'],text=True).strip()
          print('Verified candidate files:',len(expected))
          PYCODE
      - name: Prepare pinned browser driver
        run: |
          export NODE_PATH="$RUNNER_TEMP/sukun-r1130-browser/node_modules"
          echo "NODE_PATH=$NODE_PATH" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/sukun-r1130-browser" --no-audit --no-fund playwright@1.57.0
          if command -v google-chrome >/dev/null 2>&1; then
            candidate_chrome="$(command -v google-chrome)"
          else
            "$RUNNER_TEMP/sukun-r1130-browser/node_modules/.bin/playwright" install --with-deps chromium
            candidate_chrome="$(node -p 'require("playwright").chromium.executablePath()')"
          fi
          echo "CHROMIUM_PATH=$candidate_chrome" >> "$GITHUB_ENV"
      - name: Capture and verify native-DPR buttons against r1129
        run: node tests/r1130/button-clarity-browser.cjs . "$RUNNER_TEMP/r1130-button-clarity.json" ../baseline
      - name: Commit visually verified candidate
        run: |
          git add --all
          git config user.name "Sukunpro"
          git config user.email "termuxumut@gmail.com"
          git commit -m "Stage crisp gold vector controls for r1130"
          git rev-parse HEAD
          git push origin HEAD:refs/heads/release/r1130-buttons-20261027
      - name: Preserve isolated visual QA images and source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r1130-button-quality
          path: |
            ${{ runner.temp }}/r1130-button-clarity.json
            ${{ runner.temp }}/button-clarity/*.png
          if-no-files-found: warn
          retention-days: 7
