name: r1245 arrangement text containment
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  arrangement-fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned native browser
        run: |
          npm install --prefix "$RUNNER_TEMP/sukun-browser" --no-audit --no-fund playwright@1.57.0
          echo "NODE_PATH=$RUNNER_TEMP/sukun-browser/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/sukun-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify source and evidence contracts
        run: |
          node tests/arrangement-fit/contract.cjs
          python3 tests/r1213/visual-evidence-test.py
      - name: Check native theme, text containment and accessibility
        run: |
          export CHROMIUM_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          node tests/arrangement-fit/browser.cjs "$PWD" "$RUNNER_TEMP/r1245-evidence/arrangement-fit.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r1245-arrangement-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/r1245-evidence
          if-no-files-found: error
          retention-days: 30
