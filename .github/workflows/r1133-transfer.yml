name: Inspect premium Berhetiyye gemstone controls before publication
on:
  push:
    branches: [release/r1133-premium-jewels-20261027]
    paths: [.github/workflows/r1133-transfer.yml]
permissions:
  contents: write
defaults:
  run:
    working-directory: candidate
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out transfer candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: candidate
      - name: Check out unchanged r1132 visual reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c4b9abea48d0d8a473202da4020cdd6427f2794b
          path: baseline
          persist-credentials: false
      - name: Restore exact r1133 source
        run: |
          python3 - <<'PYCODE'
          import base64, subprocess, zlib
          payload = ''
          subprocess.run(['git','apply','--index','--binary','-'], input=zlib.decompress(base64.b64decode(payload)),check=True)
          expected = {'assets/runtime/health-r940.js': '0160f81e1f573b958e69aae730322c66a01da823', 'assets/runtime/startup-intro-r1027.js': '2f0a15e26431090dde9c97ad74fc249308247b06', 'css/berhet-premium-jewels-r1133.css': '8cdbf74ef61c2bc120ef6720a93d65d72ebfee59', 'index.html': '17f68ca4f7865d731f4ae545989166530cd0137b', 'manifest.webmanifest': 'ac1d6aa4bfbcf82f77fd87bf6fa15d21df820091', 'nero.html': '17f68ca4f7865d731f4ae545989166530cd0137b', 'sukun-build-r1133.json': '92ca30676da44518baae2ef0a09ca7bdb089559a', 'sukun-latest.json': '1bb326d2877ab3ef22c66aff93ed9fe86f1540db', 'sukun-site-assets-r1133.json': '699f1555ad4253af66a3be9612ca5542629e5582', 'surumler.json': 'd694bc00d45c71d9b0e80f471c0c3180996010c1', 'sw.js': '05ab625441766b7380cd2e05681da042b29d9b42', 'tests/r1133/activation-deadline-contract.cjs': '9ffe77e0d2b50569e30941d2a4e873adac4ff0c5', 'tests/r1133/button-clarity-browser.cjs': '96c47a57488d0fc459ce76d48dab73f44a9f40ce', 'tests/r1133/release-upgrade-browser.cjs': 'f45814c82e6a992333ae04a1c418e7eb46f87cac', 'tests/r1133/run-release-checks.py': 'a02a477b7ad8677904c369cc40726ae0b53a0585', 'version.txt': '4ceec9bf14d5a9fe2e182d3a30ab2528ae1517b9', 'assets/berhetiyye-premium/r1133/gem-amethyst.webp': '995ce0d26745c17c25726576a89f4876dd50f4d2', 'assets/berhetiyye-premium/r1133/gem-black-diamond.webp': '3bc548063b7f5e937de4919bb56dbb17eea7f0a8', 'assets/berhetiyye-premium/r1133/gem-citrine.webp': '52a5aa8abcdac0f4a74dde265c8b5011ad84b6c0', 'assets/berhetiyye-premium/r1133/gem-diamond.webp': '33810fe8e12789b9548e3e7f7fcfa37d7663d4ea', 'assets/berhetiyye-premium/r1133/gem-emerald.webp': 'd4fffa69dfa650955403dda1c90c91a19d73f1aa', 'assets/berhetiyye-premium/r1133/gem-ruby.webp': '56a227752feb2523c550638cd679376924bdb6f5', 'assets/berhetiyye-premium/r1133/gem-sapphire.webp': '604d52564a9ad36ce5779cefb098841ab9b73a47', 'assets/berhetiyye-premium/r1133/gem-topaz.webp': '5235c18499da09eb857c958c5f514c8c1ad33c7f'}
          for path, sha in expected.items():
              assert subprocess.check_output(['git','rev-parse',':'+path],text=True).strip()==sha,path
          assert not subprocess.check_output(['git','diff','--cached','--name-only','--','.github/'],text=True).strip()
          print('Verified candidate files:',len(expected))
          PYCODE
      - name: Verify release graph and bounded health marker
        run: |
          node tools/release-integrity.cjs . > "$RUNNER_TEMP/r1133-integrity.log"
          node tests/r1120/health-marker-bytes.cjs . "$RUNNER_TEMP/r1133-health.json"
          git restore tools/release-integrity-results.json
      - name: Prepare pinned browser driver
        run: |
          export NODE_PATH="$RUNNER_TEMP/sukun-r1133-browser/node_modules"
          echo "NODE_PATH=$NODE_PATH" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/sukun-r1133-browser" --no-audit --no-fund playwright@1.57.0
          if command -v google-chrome >/dev/null 2>&1; then
            candidate_chrome="$(command -v google-chrome)"
          else
            "$RUNNER_TEMP/sukun-r1133-browser/node_modules/.bin/playwright" install --with-deps chromium
            candidate_chrome="$(node -p 'require("playwright").chromium.executablePath()')"
          fi
          echo "CHROMIUM_PATH=$candidate_chrome" >> "$GITHUB_ENV"
      - name: Capture and verify native-DPR buttons against r1132
        env:
          SUKUN_VISUAL_MOBILE: "1"
        run: node tests/r1133/button-clarity-browser.cjs . "$RUNNER_TEMP/r1133-button-clarity.json" ../baseline
      - name: Commit visually verified candidate
        run: |
          git config user.name "Sukunpro"
          git config user.email "termuxumut@gmail.com"
          git commit -m "Stage verified premium Berhetiyye gemstone controls for r1133"
          git rev-parse HEAD
          git push origin HEAD:refs/heads/release/r1133-premium-jewels-20261027
      - name: Preserve isolated visual QA images and source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r1133-button-quality
          path: |
            ${{ runner.temp }}/r1133-button-clarity.json
            ${{ runner.temp }}/button-clarity/*.png
          if-no-files-found: warn
          retention-days: 7
