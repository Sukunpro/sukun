name: r1241 usability, concurrent saves and measured startup
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  usability-reliability:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - name: Check out immutable r1240 predecessor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 986773dc708c57100e1cac80270463d931c3a9f1
          path: previous
          persist-credentials: false
      - name: Install pinned native browser
        run: |
          npm install --prefix "$RUNNER_TEMP/sukun-browser" --no-audit --no-fund playwright@1.57.0 fake-indexeddb@6.2.4
          echo "NODE_PATH=$RUNNER_TEMP/sukun-browser/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/sukun-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Measure immutable baseline and candidate startup
        working-directory: candidate
        run: |
          export CHROMIUM_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          mkdir -p ../r1241-evidence
          node tests/performance/startup-browser.cjs ../previous ../r1241-evidence/performance-r1240.json
          node tests/performance/startup-browser.cjs "$PWD" ../r1241-evidence/performance-r1241.json
      - name: Verify current navigation and multi-tab save behavior
        working-directory: candidate
        run: |
          export CHROMIUM_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          node tests/r1241/navigation-ui.cjs
          node tests/r1241/intro-preload.cjs
          node tests/r1241/frequency-set-controlled.cjs
          set -o pipefail
          node tests/r1241/frequency-set-concurrency.cjs 2>&1 | tee ../r1241-evidence/frequency-concurrency.log
          node tests/r1241/navigation-browser.cjs "$PWD" ../r1241-evidence/navigation
      - name: Verify immediate-previous offline update and rollback
        working-directory: candidate
        run: |
          export CHROMIUM_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          node tests/r1213/release-upgrade-browser.cjs "$PWD" ../previous ../r1241-evidence/upgrade.json
      - name: Upload exact-source evidence and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r1241-usability-${{ github.event.pull_request.head.sha || github.sha }}
          path: r1241-evidence
          if-no-files-found: error
          retention-days: 30
