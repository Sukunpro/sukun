name: Required current-release source-bound checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - name: Validate current identity and required suite
        id: release
        run: |
          python3 - <<'PYCODE'
          import os, re
          from pathlib import Path
          root = Path('candidate')
          build = (root / 'version.txt').read_text().strip()
          assert re.fullmatch(r'r[0-9]+', build) and int(build[1:]) >= 1213, 'Current suite requires r1213+ contract'
          for name in ['run-current-checks.py', 'release-upgrade-browser.cjs', 'practice-flow.cjs', 'saver-content.cjs', 'update-offline.cjs']:
              assert (root / 'tests/r1213' / name).is_file(), 'Missing required current suite: ' + name
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'build={build}\n')
          PYCODE
      - name: Check out immutable last pre-migration upgrade reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8bcbe4c0d902967dc9e6f60d3cfe3a4b4298e755
          path: upgrade-baseline
          persist-credentials: false
      - name: Install pinned native browser test dependency
        run: |
          export NODE_PATH="$RUNNER_TEMP/sukun-browser/node_modules"
          echo "NODE_PATH=$NODE_PATH" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/sukun-browser" --no-audit --no-fund playwright@1.57.0 fake-indexeddb@6.2.4
          "$RUNNER_TEMP/sukun-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -p 'require("playwright").chromium.executablePath()')" >> "$GITHUB_ENV"
      - name: Run mandatory current source and native offline acceptance
        working-directory: candidate
        run: python3 tests/r1213/run-current-checks.py --scope full --upgrade-baseline ../upgrade-baseline --output ../acceptance
      - name: Upload fresh synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.release.outputs.build }}-acceptance-${{ github.event.pull_request.head.sha || github.sha }}
          path: acceptance
          if-no-files-found: error
          retention-days: 30
