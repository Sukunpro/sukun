name: Verify and transfer Delail global pause fix
on:
  push:
    branches: [release/r1129-delail-pause-20261027]
    paths: [.github/workflows/r1129-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out transfer branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Restore exact candidate source blobs
        run: |
          python3 - <<'PYCODE'
          import base64, json, subprocess, zlib
          payload = ''
          subprocess.run(['git', 'apply', '--index', '--binary', '-'], input=zlib.decompress(base64.b64decode(payload)), check=True)
          expected = {'assets/runtime/health-r940.js': 'fa140bdd44b4c852765c611b31d4780704f49791', 'assets/runtime/startup-intro-r1027.js': '5a5b0c7c2630cf9abba65404e8c85b769c737785', 'index.html': '338d7b87623b8eeb3a021efecbc6e97039b37ab2', 'manifest.webmanifest': 'd84d13191444d9737c6491033e325289d759dbd3', 'nero.html': '338d7b87623b8eeb3a021efecbc6e97039b37ab2', 'sukun-build-r1129.json': '88515f29e3099b1d5e6131d291547fb6450dd544', 'sukun-latest.json': '1111623fc72fd41fb11b13d80c08acebc565b879', 'sukun-site-assets-r1129.json': '84fdddec5634ee66f6051c8db1bce6f73fc58293', 'surumler.json': '30ea5662e146af54963fa12c743c00a8d1592020', 'sw.js': '614e4fda201a99587506f10370216440013a3ad7', 'tests/prayer_recording_faults.cjs': '8ae4558c125764ce0bf1fa23a290883b998625c1', 'tests/r1120/health-marker-bytes.cjs': '92f7f75af74da6990f7e6a124de35e2a35c168bf', 'tests/r1128/delail-screen-browser.cjs': 'ac2c2f860595084bd2fee71471e526cd4a1bc9b7', 'tests/r1129/activation-deadline-contract.cjs': 'c903a2f20d78bddf1a4695a6aff3885844eea671', 'tests/r1129/delail-global-native-browser.cjs': 'a052cab644666f26a80b42056e702c43687eb6e2', 'tests/r1129/delail-global-transport.cjs': 'aa3bf1880317fe54ea4b24bd46b73b2e6431b44e', 'tests/r1129/release-upgrade-browser.cjs': '5d6bc2d8292536da50dae018c47923affcce8384', 'tests/r1129/run-release-checks.py': '448f43305d183dffe4bfb3dcdb12df969686cba6', 'version.txt': 'bf45eca78a4bbb188ef68d7f1ceb70d1f19c9426'}
          for name, blob in expected.items():
              actual = subprocess.check_output(['git', 'rev-parse', ':' + name], text=True).strip()
              assert actual == blob, name + ': candidate blob mismatch'
          assert not subprocess.check_output(['git', 'diff', '--cached', '--name-only', '--', '.github/'], text=True).strip()
          print('Verified candidate source blobs:', len(expected))
          PYCODE
      - name: Prepare pinned Playwright and native Chromium
        run: |
          export NODE_PATH="$RUNNER_TEMP/sukun-r1129-browser/node_modules"
          echo "NODE_PATH=$NODE_PATH" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/sukun-r1129-browser" --no-audit --no-fund playwright@1.57.0
          if command -v google-chrome >/dev/null 2>&1; then
            candidate_chrome="$(command -v google-chrome)"
          elif command -v chromium >/dev/null 2>&1; then
            candidate_chrome="$(command -v chromium)"
          else
            "$RUNNER_TEMP/sukun-r1129-browser/node_modules/.bin/playwright" install --with-deps chromium
            candidate_chrome="$(node -p 'require("playwright").chromium.executablePath()')"
          fi
          echo "CHROMIUM_PATH=$candidate_chrome" >> "$GITHUB_ENV"
      - name: Verify actual global reader transport and native MP3 clocks
        run: |
          node tests/r1129/delail-global-transport.cjs . "$RUNNER_TEMP/r1129-global-transport.json"
          node tests/r1129/delail-global-native-browser.cjs . "$RUNNER_TEMP/r1129-native-browser.json"
          node tests/r1128/delail-screen-browser.cjs . "$RUNNER_TEMP/r1129-delail-screen.json"
      - name: Commit verified source to transfer branch
        run: |
          git add --all
          git config user.name "Sukunpro"
          git config user.email "termuxumut@gmail.com"
          git commit -m "Stage verified r1129 Delail global pause source"
          git rev-parse HEAD
          git push origin HEAD:refs/heads/release/r1129-delail-pause-20261027
      - name: Preserve source-bound check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r1129-focused-browser-evidence
          path: ${{ runner.temp }}/r1129-*.json
          if-no-files-found: warn
          retention-days: 7
