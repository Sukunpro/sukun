name: r1248 journey loop buffering
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  loop-buffering:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact watchdog and passive diagnostic regressions
        run: |
          mkdir -p "$RUNNER_TEMP/r1248-evidence"
          node tests/r1248/watchdog-buffering.cjs > "$RUNNER_TEMP/r1248-evidence/watchdog-buffering.json"
          node tests/r1248/health-watchdog.cjs > "$RUNNER_TEMP/r1248-evidence/health-watchdog.json"
          node tests/r1248/watchdog-diagnostic.cjs > "$RUNNER_TEMP/r1248-evidence/watchdog-diagnostic.json"
          node tests/r1247/watchdog-progress.cjs > "$RUNNER_TEMP/r1248-evidence/watchdog-progress.json"
          node tests/r1247/health-interruption.cjs > "$RUNNER_TEMP/r1248-evidence/health-interruption.json"
          node tools/release-integrity.cjs > "$RUNNER_TEMP/r1248-evidence/integrity-summary.json"
      - name: Install pinned browser for native loop regression
        run: |
          npm install --prefix "$RUNNER_TEMP/sukun-browser" --no-audit --no-fund playwright@1.57.0
          echo "NODE_PATH=$RUNNER_TEMP/sukun-browser/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/sukun-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check complete app native loops at a buffering boundary
        run: |
          export CHROMIUM_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          node tests/r1248/browser-buffering.cjs "$PWD" "$RUNNER_TEMP/r1248-evidence/browser-buffering.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r1248-buffering-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/r1248-evidence
          if-no-files-found: error
          retention-days: 30
