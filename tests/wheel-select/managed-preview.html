<!doctype html><meta charset="utf-8"><title>Sükûn wheel heading QA</title>
<style>body{margin:0;background:#ddd;font:14px system-ui}header{padding:8px}iframe{display:block;border:0;margin:0 auto}pre{max-height:160px;overflow:auto;white-space:pre-wrap;font:12px/1.35 monospace;margin:8px}</style>
<header>Wheel heading QA <button id="run" disabled>Run layout checks</button> <button id="present" disabled>Show heading</button></header><pre id="result">Loading</pre><iframe id="app" height="1050" width="720"></iframe>
<script>
const frame=document.querySelector('#app'),output=document.querySelector('#result'),run=document.querySelector('#run'),present=document.querySelector('#present'),mode=new URLSearchParams(location.search).get('mode')||'berhet',wait=ms=>new Promise(r=>setTimeout(r,ms));
for(const [k,v]of Object.entries({'sukun.theme':JSON.stringify(mode),'sukun.ui.shellMode':'classic','sukun.obDone':'1','sukun.onboardSeen':'1','sukun.r920.focus':'0','sukun.kandil.idle':JSON.stringify('off')}))localStorage.setItem(k,v);
frame.onload=async()=>{try{const w=frame.contentWindow,d=w.document;await wait(2500);w.obClose?.();w.SukunKandil.setMode('off',false);d.getElementById('dcClose')?.click();w.KLT_AC('LABELLED-wheel-heading-disposable-profile');await w.SukunTabOwner.run('manual',async()=>{const s=await w.SukunSessionState.command('select',{mode,index:8,journeyKind:mode==='berhet'?'28':'99'});if(!s.accepted)throw Error('Selection rejected')},{prime:false,releaseAfter:true});d.querySelector('.tab[data-t=zkr]').click();await wait(500);if(d.getElementById('r938PanelToggle').getAttribute('aria-expanded')!=='true')d.getElementById('r938PanelToggle').click();await wait(150);d.getElementById('r920ViewOptions').open=true;await wait(300);run.disabled=false;present.disabled=false;output.textContent='Ready'}catch(e){output.textContent=e.stack}};frame.src='../../nero.html';
present.onclick=async()=>{const w=frame.contentWindow,d=w.document;frame.width=720;w.document.documentElement.style.zoom='1';w.I18N.set('tr');d.getElementById('r920ViewOptions').open=true;d.getElementById('r924WheelGalleryDetails').open=true;await wait(150);d.querySelector('#r924WheelGalleryDetails>summary').scrollIntoView({block:'center'})};
run.onclick=async()=>{run.disabled=true;const w=frame.contentWindow,d=w.document,res=[],$=id=>d.getElementById(id),snap=()=>{const s=w.SukunSessionState.snapshot();return JSON.stringify({mode:s.activeMode,index:s.activeIndex,count:s.count,target:s.target,playing:s.playing,paused:s.paused})},check=(name,passed,evidence)=>{res.push({name,passed:!!passed,evidence});if(!passed)throw Error(name+' '+JSON.stringify(evidence))};
try{const before=snap();
 for(const width of [320,393,480,481,720,1024,1280])for(const scale of (width>=720?[1,1.25,1.5,2]:[1]))for(const lang of ['tr','en']){
  frame.width=width;d.documentElement.style.zoom=String(scale);w.I18N.set(lang);$('r920ViewOptions').open=true;await wait(80);
  for(const open of [false,true]){
   $('r924WheelGalleryDetails').open=open;await wait(15);const summary=d.querySelector('#r924WheelGalleryDetails>summary'),r=summary.getBoundingClientRect(),range=d.createRange();range.selectNodeContents(summary);const t=range.getBoundingClientRect(),s=w.getComputedStyle(summary),dx=Math.abs(r.x+r.width/2-t.x-t.width/2),dy=Math.abs(r.y+r.height/2-t.y-t.height/2),e={width,scale,lang,open,rect:r.toJSON(),text:t.toJSON(),dx,dy,display:s.display,textAlign:s.textAlign,padding:[s.paddingLeft,s.paddingRight],client:summary.clientWidth,scroll:summary.scrollWidth,frameWidth:w.innerWidth,viewport:d.documentElement.clientWidth,pageWidth:d.documentElement.scrollWidth,label:summary.textContent};
   check('Centered safe heading '+[width,scale,lang,open].join('/'),s.display==='grid'&&s.textAlign==='center'&&s.paddingLeft===s.paddingRight&&dx<=1.5*scale&&dy<=1.5*scale&&summary.scrollWidth<=summary.clientWidth+1&&t.left>=r.left+38*scale-1&&t.right<=r.right-38*scale+1&&t.top>=r.top+12*scale-1&&t.bottom<=r.bottom-12*scale+1,e);
  }
 }
 d.documentElement.style.zoom='1';frame.width=720;w.I18N.set('tr');await wait(80);
 for(let i=0;i<3;i++){let summary=d.querySelector('#r924WheelGalleryDetails>summary');summary.click();await wait(30);check('Native click closes '+i,!$('r924WheelGalleryDetails').open);summary.click();await wait(30);check('Native click opens '+i,$('r924WheelGalleryDetails').open)}
 check('Native disclosure and unchanged selection',d.querySelector('#r924WheelGalleryDetails>summary').parentElement.tagName==='DETAILS'&&snap()===before);
 d.querySelector('#r924WheelGalleryDetails>summary').scrollIntoView({block:'center'});output.textContent=JSON.stringify({allPassed:true,mode,total:res.length,results:res,limitations:['Local synthetic profile. 320–1280px at 100%; 720–1280px additionally at CSS zoom 125/150/200%. CSS zoom is not browser zoom or physical-device acceptance.','Keyboard activation and native accessibility emulation are covered by the native wrapper, pending CI.']},null,2);
}catch(e){output.textContent=JSON.stringify({allPassed:false,mode,error:e.stack,results:res},null,2)}finally{d.documentElement.style.zoom='1';run.disabled=false}
};
</script>
