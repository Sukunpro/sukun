<!doctype html><meta charset="utf-8"><title>Sükûn arrangement QA</title>
<style>body{margin:0;background:#ddd;font:14px system-ui}header{padding:8px}iframe{display:block;border:0;margin:0 auto}pre{max-height:180px;overflow:auto;white-space:pre-wrap;font:12px monospace}button,select{padding:5px}</style>
<header>Arrangement layout <button id="run" disabled>Run layout checks</button> <select id="view"><option value="rxChips">Input</option><option value="grid">Cards</option><option value="ai">AI actions</option><option value="plan">Plan</option><option value="session">Session</option></select> <button id="show" disabled>Show section</button></header><pre id="result">Loading</pre><iframe id="app" width="393" height="1000"></iframe>
<script>
const frame=document.querySelector('#app'),out=document.querySelector('#result'),run=document.querySelector('#run'),show=document.querySelector('#show'),mode=new URLSearchParams(location.search).get('mode')||'berhet',wait=ms=>new Promise(r=>setTimeout(r,ms));
for(const[k,v]of Object.entries({'sukun.theme':JSON.stringify(mode),'sukun.ui.shellMode':'classic','sukun.obDone':'1','sukun.onboardSeen':'1','sukun.r920.focus':'0','sukun.kandil.idle':'"off"','sukun.aiConsent.r310':'1'}))localStorage.setItem(k,v);
let longZikir='';
const fixtureText='This is a synthetic layout response. No personal information or online provider is used. '+('A calm reflection with a long explanation. ').repeat(12);
async function populate(w,d){
 longZikir=(w.SukunAIPlan.inventory().zik.find(x=>/Evvel/i.test(x.name))||w.SukunAIPlan.inventory().zik.slice().sort((a,b)=>b.name.length-a.name.length)[0]||{}).name||'';
 d.getElementById('rxInput').value='Synthetic layout fixture';d.getElementById('rxGo').click();
 w.SukunAIRouter={hasAnyKey:()=>true,snapshot:()=>({busy:false}),complete:async q=>({providerLabel:'Synthetic fixture',model:'layout-only',text:q.user.includes('5 ile 10')?JSON.stringify({title:'Synthetic multistage layout',explanation:fixtureText,steps:Array.from({length:5},(_,i)=>({type:'frequency',carrier_hz:180,beat_hz:6,duration_min:3,mode:'binaural'}))}):q.system.includes('JSON')?JSON.stringify({carrier_hz:180,beat_hz:6,mode:'binaural',duration_min:30,ambience:[],zikir:longZikir,zikir_reps:33,explanation:fixtureText}):fixtureText})};
 d.querySelector('[data-rxai]').click();await wait(120);
 await w.SukunAIPlan.generate('Synthetic fixture');await w.SukunAIPlan.generateSession('Synthetic fixture');await wait(150);
}
frame.onload=async()=>{try{const w=frame.contentWindow,d=w.document;await wait(2500);w.obClose?.();w.SukunKandil.setMode('off',false);d.getElementById('dcClose')?.click();w.KLT_AC('LABELLED-arrangement-layout-disposable-profile');await w.SukunTabOwner.run('manual',async()=>{const selected=await w.SukunSessionState.command('select',{mode,index:8,journeyKind:mode==='berhet'?'28':'99'});if(!selected.accepted)throw Error('Theme selection rejected')},{prime:false,releaseAfter:true});d.querySelector('.tab[data-t=rx]').click();await populate(w,d);run.disabled=false;show.disabled=false;out.textContent='Ready'}catch(e){out.textContent=e.stack}};frame.src='../../nero.html';
show.onclick=async()=>{const w=frame.contentWindow,d=w.document;frame.width=393;w.document.documentElement.style.zoom='1';w.I18N.set('tr');await wait(100);const key=document.querySelector('#view').value,el=key==='rxChips'?d.getElementById('rxChips'):d.querySelector({grid:'.rxGrid',ai:'.rxAIBox .rxUse',plan:'#r320AIPlan',session:'#r330AISession'}[key]);el.scrollIntoView({block:'center'})};
function contentReady(d){
 const count=selector=>d.querySelectorAll(selector).length;
 const content={explanations:count('#tab-rx .rxAIText'),actions:count('#tab-rx .rxUse'),planCells:count('#r320AIPlan .r320PlanGrid>div'),steps:count('#r330AISession .r330Step')};
 if(content.explanations!==3||content.actions!==4||content.planCells!==6||content.steps!==5)throw Error('Missing synthetic AI content '+JSON.stringify(content));
 for(const el of d.querySelectorAll('#tab-rx .rxAIText'))if(!el.textContent.includes(fixtureText))throw Error('Missing long synthetic explanation');
 if(!longZikir||!d.querySelector('#r320AIPlan').textContent.includes(longZikir))throw Error('Missing long inventory zikir');
 return {...content,longZikir};
}
function geometry(d,w){const rows=[],textRects=el=>{const rs=[],walk=d.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;while(n=walk.nextNode()){if(!n.textContent.trim())continue;const range=d.createRange();range.selectNodeContents(n);for(const rect of range.getClientRects())if(rect.width&&rect.height)rs.push(rect)}return rs};
for(const el of d.querySelectorAll('#tab-rx .rxItem,#tab-rx .rxUse,#rxGo,#rxChips .rxChip,#tab-rx .rxActions>.btn')){const r=el.getBoundingClientRect(),s=w.getComputedStyle(el),scale=Number(d.documentElement.style.zoom)||1,pad=el.classList.contains('rxItem')?{x:26,y:15}:el.classList.contains('rxChip')?{x:mode==='berhet'?21:10,y:mode==='berhet'?9:5}:{x:29,y:10},rects=textRects(el),bad=rects.filter(t=>t.left<r.left+pad.x*scale-1||t.right>r.right-pad.x*scale+1||t.top<r.top+pad.y*scale-1||t.bottom>r.bottom-pad.y*scale+1);rows.push({tag:el.id||el.className,label:el.textContent.trim(),r:r.toJSON(),bad:bad.map(x=>x.toJSON()),ok:r.width>0&&r.height>=44*scale-1&&el.scrollWidth<=el.clientWidth+1&&bad.length===0})}for(const el of d.querySelectorAll('#tab-rx .rxAIText,#r320AIPlan .r320PlanGrid>div,#r330AISession .r330Step')){const r=el.getBoundingClientRect(),scale=Number(d.documentElement.style.zoom)||1,s=w.getComputedStyle(el),pad={left:parseFloat(s.paddingLeft)*scale,right:parseFloat(s.paddingRight)*scale,top:parseFloat(s.paddingTop)*scale,bottom:parseFloat(s.paddingBottom)*scale},bad=textRects(el).filter(t=>t.left<r.left+pad.left-1||t.right>r.right-pad.right+1||t.top<r.top+pad.top-1||t.bottom>r.bottom-pad.bottom+1);rows.push({tag:el.className,label:el.textContent.trim(),r:r.toJSON(),bad:bad.map(x=>x.toJSON()),ok:r.width>0&&r.height>0&&el.scrollWidth<=el.clientWidth+1&&bad.length===0})}return rows}
run.onclick=async()=>{run.disabled=true;const w=frame.contentWindow,d=w.document,res=[];try{
const content=contentReady(d),before=w.SukunSessionState.snapshot();if(d.documentElement.dataset.r1074Theme!==mode)throw Error('Wrong canonical theme');
for(const width of [320,360,393,430,480,481,720,1024,1280])for(const scale of(width>=720?[1,1.25,1.5,2]:[1]))for(const lang of ['tr','en']){
 frame.width=width;d.documentElement.style.zoom=String(scale);w.I18N.set(lang);await wait(100);contentReady(d);const rows=geometry(d,w),page={width:d.documentElement.clientWidth,scroll:d.documentElement.scrollWidth};const ok=rows.length>=40&&rows.every(r=>r.ok)&&page.scroll<=page.width+1;res.push({width,scale,lang,ok,page,rows});if(!ok)throw Error('Overflow '+[width,scale,lang]+' '+JSON.stringify(rows.filter(x=>!x.ok)))}
const after=w.SukunSessionState.snapshot();if(before.playing!==after.playing||before.count!==after.count)throw Error('Session state changed');
frame.width=393;d.documentElement.style.zoom='1';w.I18N.set('tr');await wait(80);
for(let i=0;i<3;i++){d.querySelector('.tab[data-t=amb]').click();d.querySelector('.tab[data-t=rx]').click();await wait(200);if(d.querySelector('#tab-rx').hidden||!geometry(d,w).every(r=>r.ok))throw Error('Return to arrangement failed')}
const returned=w.SukunSessionState.snapshot();if(before.playing!==returned.playing||before.count!==returned.count)throw Error('Tab return changed session state');contentReady(d);
const sourceHashes={};for(const file of ['nero.html','css/arrangement-fit.css']){const b=await(await fetch('../../'+file,{cache:'no-store'})).arrayBuffer();sourceHashes[file]=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b))).map(n=>n.toString(16).padStart(2,'0')).join('')}
out.textContent=JSON.stringify({allPassed:true,mode,cases:res.length,content,keyboardCycles:3,stateUnchanged:true,sourceHashes,results:res,limitations:['Synthetic provider only, no network requests or user API keys.','Managed browser, not physical Android/iPhone or native browser zoom.','Native keyboard and forced-color checks belong to the native test wrapper.']});
}catch(e){out.textContent=JSON.stringify({allPassed:false,mode,error:e.stack,results:res})}finally{run.disabled=false}};
</script>
