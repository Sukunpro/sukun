for(const [k,v]of Object.entries({'sukun.theme':JSON.stringify(theme),'sukun.ui.shellMode':'classic','sukun.onboardSeen':'1','sukun.obDone':'1','sukun.obSeenBuild':'"r1236"','sukun.r920.focus':'0'}))localStorage.setItem(k,v);

let readyOnce=false; frame.onload=async()=>{if(readyOnce){result.textContent+="\nFRAME RELOADED";return}readyOnce=true;const w=frame.contentWindow,d=w.document;await wait(3000);try{w.obClose?.();d.querySelector('#dcClose')?.click();w.KLT_AC('LABELLED-stats-disposable-layout-profile');await w.SukunTabOwner.run('manual',async()=>{const selected=await w.SukunSessionState.command('select',{mode,index:9,journeyKind:mode==='esma'?'99':'28'});if(!selected.accepted)throw Error('Fixture selection failed');w.SukunSessionMemory.save();w.SukunProgressJournal.commit('lower-stats-fixture-selection');return selected},{prime:false,releaseAfter:true});d.querySelector('.tab[data-t=zkr]').click();await wait(700);w.SukunLowerStats.set('normal');w.SukunBerhetLayout.setFocusControls(true);await wait(400);d.querySelector('.r920Stats').scrollIntoView({block:'center'});result.textContent='Ready';document.querySelector('#run').disabled=false}catch(e){result.textContent=e.stack}};

try{
 if(d.body.classList.contains('sukun-tefekkur-mode'))d.querySelector('#r920TefExit').click();d.querySelector('.tab[data-t=zkr]').click();w.SukunBerhetLayout.setFocusControls(true);w.SukunLowerStats.set('normal');await w.SukunTabOwner.run('manual',()=>true,{prime:false,releaseAfter:true});await wait(500);check('Requested theme retained',d.documentElement.dataset.r1074Theme===mode,{expected:mode,actual:d.documentElement.dataset.r1074Theme});check('One selector',d.querySelectorAll('#r1236StatsSelect').length===1);

 check('Compact edit touch target',box('#r920Remaining').height>=44&&box('#r920Remaining').width>=44,box('#r920Remaining'));
 check('No changed counts',JSON.stringify(counts())===JSON.stringify(before),counts());check('Wheel unchanged',JSON.stringify(wheel())===JSON.stringify(wheelBefore));
 d.querySelector('#r920Remaining').click();await wait(80);check('Compact opens native editor',!d.querySelector('#r1227CountForm').hidden);
 const countBefore=w.SukunSessionState.snapshot().count;const editRemaining=Number(before.r920Remaining)>1?Number(before.r920Remaining)-1:2;d.querySelector('#r1227CountValue').value=String(editRemaining);d.querySelector('#r1227CountForm').requestSubmit();for(let i=0;i<50&&(!d.querySelector('#r1227CountForm').hidden||d.querySelector('#r1227CountUndo').hidden);i++)await wait(100);check('Native remaining edit',w.SukunSessionState.snapshot().target-w.SukunSessionState.snapshot().count===editRemaining&&d.querySelector('#r1227CountForm').hidden&&!d.querySelector('#r1227CountUndo').hidden,{counts:counts(),formHidden:d.querySelector('#r1227CountForm').hidden,undoHidden:d.querySelector('#r1227CountUndo').hidden,error:d.querySelector('#r1227CountError').textContent});d.querySelector('#r1227CountUndo').click();for(let i=0;i<30&&w.SukunSessionState.snapshot().count!==countBefore;i++)await wait(100);check('Undo unchanged count',w.SukunSessionState.snapshot().count===countBefore);
 d.querySelector('#r920Remaining').dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',bubbles:true}));await wait(40);check('Keyboard opens native editor',!d.querySelector('#r1227CountForm').hidden);
 d.querySelector('#r1227CountValue').value='0';d.querySelector('#r1227CountForm').requestSubmit();await wait(50);check('Invalid edit rejected',d.querySelector('#r1227CountValue').getAttribute('aria-invalid')==='true'&&w.SukunSessionState.snapshot().count===countBefore);

 w.SukunBerhetLayout.setFocusControls(false);check('Easy controls retain native edit gate',d.querySelector('#r920Remaining').tabIndex===-1&&d.querySelector('#r1227CountEntry').hidden&&d.querySelector('#r920Remaining').getClientRects().length>0);w.SukunBerhetLayout.setFocusControls(true);
 d.querySelector('#r920Remaining').click();d.querySelector('#r1227CountValue').focus();select('hidden');await wait(100);check('Hide closes native editor',d.querySelector('#r1227CountForm').hidden&&d.querySelector('#r1227CountEntry').hidden);check('Hide safely moves focus',d.activeElement===d.querySelector('#r1236StatsSelect'));check('Hidden persists',localStorage.getItem('sukun.practice.tefStats.v1')==='hidden');
 select('normal');await wait(80);check('Restore keeps counts',JSON.stringify(counts())===JSON.stringify(before));
 d.querySelector('#r920TefExit').click();await wait(300);check('Exit works',!d.body.classList.contains('sukun-tefekkur-mode'));check('Selector returns to settings',d.querySelector('#r920ViewOptions').contains(d.querySelector('#r1236StatsSelect')));check('Still one selector',d.querySelectorAll('#r1236StatsSelect').length===1);

 check('No horizontal overflow',d.documentElement.scrollWidth<=width+1,{width,scroll:d.documentElement.scrollWidth});
 for(const viewport of [320,393,500,720,1280]){

   check('Responsive counts retained '+viewport+' '+display,JSON.stringify(counts())===stable);
  }
 }
 // Exercise the longest supported target through native controls, not owner internals.

 await w.SukunTabOwner.run('manual',async()=>{
  const selected=await w.SukunSessionState.command('select',{mode,index:9,journeyKind:'single'});

  w.SukunSessionMemory.save();w.SukunProgressJournal.commit('lower-stats-max-target');
 },{prime:false,releaseAfter:true});
 for(let i=0;i<30&&(w.SukunSessionState.snapshot().target!==99999||d.getElementById('r920Target').textContent!=='99999');i++)await wait(100);

 for(const display of ['normal','compact']){
  select(display);await wait(120);
  const geometry=[...d.querySelectorAll('.r920Stats>span')].map(card=>{
   const value=card.querySelector('b'),range=d.createRange();range.selectNodeContents(value);
